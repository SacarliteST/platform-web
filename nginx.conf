server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA: любой неизвестный путь отдаёт index.html (deep-link + reload).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хешированные ассеты Vite — иммутабельный кэш.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Рантайм-конфиг подменяется на окружение — никогда не кэшировать.
    location = /runtime-config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # index.html не кэшировать, чтобы подхватывались новые хеши ассетов.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
